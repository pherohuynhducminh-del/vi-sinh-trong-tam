name: Hóa Sinh 2 RC7
on:
  push:
    branches: [biochemistry-web]
    paths: ['biochemistry/**', '.github/workflows/biochemistry-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: biochemistry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
